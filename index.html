<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PriyaVRana-Ai</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #111827;
    }

    .app {
      min-height: 100vh;
      display: flex;
    }

    /* SIDEBAR */
    .sidebar {
      width: 280px;
      min-height: 100vh;
      padding: 22px 16px;
      color: white;

      background:
        linear-gradient(
          180deg,
          #062b12 0%,
          #138a35 28%,
          #f58220 50%,
          #ffffff 55%,
          #f58220 62%,
          #138a35 82%,
          #062b12 100%
        );

      border-right: 2px solid #e58a20;
    }

    .brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand .radhe {
      font-size: 21px;
      font-weight: bold;
    }

    .brand h2 {
      margin: 12px 0 8px;
      font-size: 27px;
    }

    .brand p {
      margin: 0;
      font-size: 17px;
      font-weight: bold;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .menu button {
      width: 100%;
      padding: 15px;
      border-radius: 15px;

      border: 1px solid rgba(255,255,255,0.4);

      background: rgba(0,0,0,0.45);
      color: white;

      text-align: left;
      font-size: 17px;
      font-weight: bold;

      cursor: pointer;
      transition: 0.2s;
    }

    .menu button:hover,
    .menu button.active {
      background: linear-gradient(
        90deg,
        #f97316,
        #ffad1f
      );

      transform: translateX(3px);
    }

    .side-bottom {
      margin-top: 35px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    /* MAIN */
    .main {
      flex: 1;
      padding: 22px;
      max-width: 1200px;
      margin: auto;
    }

    .header {
      text-align: center;
    }

    .header h1 {
      margin: 5px 0 8px;
      font-size: 45px;

      background:
        linear-gradient(
          90deg,
          #e64a19,
          #111827,
          #138a35
        );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .header p {
      margin: 0 0 24px;
      font-size: 20px;
      font-weight: bold;
    }

    /* WELCOME */
    .welcome {
      padding: 28px;
      text-align: center;

      border-radius: 22px;
      border: 1px solid #e7c98f;

      background:
        linear-gradient(
          100deg,
          #fff4d6,
          #ffffff,
          #edfff1
        );

      box-shadow: 0 5px 18px rgba(0,0,0,0.12);
    }

    .welcome h2 {
      margin: 0 0 10px;
      color: #c94b20;
      font-size: 30px;
    }

    .welcome p {
      margin: 0;
      font-size: 21px;
      font-weight: bold;
    }

    /* ROBOT */
    .robot {
      margin-top: 22px;

      min-height: 320px;

      padding: 35px;

      border-radius: 24px;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;

      background:
        radial-gradient(
          circle at 20% 50%,
          #164565,
          #02070c 70%
        );

      color: white;

      overflow: hidden;
    }

    .robot-icon {
      font-size: 125px;
      filter: drop-shadow(0 0 20px #00e5ff);
    }

    .robot-text {
      font-size: 29px;
      font-weight: bold;
      line-height: 1.5;
    }

    .robot-text span {
      color: #ff971b;
    }

    /* INPUT */
    .chat-box {
      margin-top: 20px;

      display: flex;
      gap: 10px;

      padding: 12px;

      border: 2px solid #ddd;
      border-radius: 18px;

      background: white;

      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .chat-box input {
      flex: 1;

      border: none;
      outline: none;

      padding: 12px;

      font-size: 19px;
    }

    .send-btn {
      border: none;
      border-radius: 14px;

      padding: 0 23px;

      background:
        linear-gradient(
          135deg,
          #ff7800,
          #159447
        );

      color: white;

      font-size: 26px;

      cursor: pointer;
    }

    .answer {
      display: none;

      margin-top: 12px;

      padding: 18px;

      border-radius: 15px;

      background: #f1f5f9;

      font-size: 17px;

      white-space: pre-wrap;
    }

    /* QUICK BUTTONS */
    .quick-buttons {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 18px;

      margin-top: 20px;
    }

    .quick-buttons button {
      padding: 23px 10px;

      border-radius: 18px;

      border: 1px solid #ddd;

      background: white;

      font-size: 18px;
      font-weight: bold;

      cursor: pointer;

      transition: 0.2s;
    }

    .quick-buttons button:hover {
      transform: translateY(-4px);

      box-shadow:
        0 8px 18px
        rgba(0,0,0,0.12);
    }

    .shayari {
      color: #d43b21;
    }

    .song {
      color: #5925c8;
    }

    .study {
      color: #145dcc;
    }

    .comedy {
      color: #dc7800;
    }

    /* MOBILE */
    @media (max-width: 850px) {

      .sidebar {
        width: 220px;
      }

      .header h1 {
        font-size: 34px;
      }

      .robot {
        flex-direction: column;
        text-align: center;
      }

      .quick-buttons {
        grid-template-columns:
          repeat(2, 1fr);
      }
    }

    @media (max-width: 650px) {

      .app {
        display: block;
      }

      .sidebar {
        width: 100%;
        min-height: auto;
      }

      .menu {
        display: grid;

        grid-template-columns:
          repeat(2, 1fr);
      }

      .main {
        padding: 14px;
      }

      .robot-icon {
        font-size: 85px;
      }

      .robot-text {
        font-size: 22px;
      }

      .quick-buttons {
        gap: 10px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="brand">

      <div class="radhe">
        🙏 Radhe Radhe 🙏
      </div>

      <h2>
        PriyaVRana-Ai
      </h2>

      <p>
        मैं आपका स्वागत है ❤️
      </p>

    </div>


    <div class="menu">

      <button
        class="active"
        onclick="selectMenu('Home')">
        🏠 Home
      </button>

      <button
        onclick="selectMenu('AI Chat')">
        💬 AI Chat
      </button>

      <button
        onclick="selectMenu('Shayari AI')">
        🪶 Shayari AI
      </button>

      <button
        onclick="selectMenu('Song AI')">
        🎵 Song AI
      </button>

      <button
        onclick="selectMenu('Study AI')">
        📖 Study AI
      </button>

      <button
        onclick="selectMenu('Comedy AI')">
        😀 Comedy AI
      </button>

      <button
        onclick="selectMenu('Voice AI')">
        🎙️ Voice AI
      </button>

      <button
        onclick="selectMenu('Settings')">
        ⚙️ Settings
      </button>

      <button
        onclick="selectMenu('Admin Panel')">
        🛡️ Admin Panel
      </button>

    </div>


    <div class="side-bottom">
      Radhe Radhe 💛
    </div>

  </aside>


  <!-- MAIN -->

  <main class="main">

    <header class="header">

      <h1>
        👑 PriyaVRana-Ai
      </h1>

      <p>
        All in One AI Assistant
      </p>

    </header>


    <!-- WELCOME -->

    <section class="welcome">

      <h2>
        Radhe Radhe 🙏
      </h2>

      <p>
        PriyaVRana-Ai में आपका स्वागत है ❤️
      </p>

    </section>


    <!-- ROBOT -->

    <section class="robot">

      <div class="robot-icon">
        🤖
      </div>

      <div class="robot-text">

        मैं
        <span>PriyaVRana-Ai</span>
        हूँ

        <br>

        आपकी हर जरूरत का

        <br>

        स्मार्ट साथी ❤️

      </div>

    </section>


    <!-- INPUT -->

    <div class="chat-box">

      <input
        id="question"
        type="text"
        placeholder="Ask PriyaVRana Ai"
        onkeydown="
          if(event.key === 'Enter'){
            reply();
          }
        "
      >

      <button
        class="send-btn"
        onclick="reply()">

        ➤

      </button>

    </div>


    <!-- ANSWER -->

    <div
      id="answer"
      class="answer">
    </div>


    <!-- QUICK BUTTONS -->

    <div class="quick-buttons">

      <button
        class="shayari"
        onclick="quickAsk('Shayari AI')">

        🪶
        <br>

        Shayari AI

      </button>


      <button
        class="song"
        onclick="quickAsk('Song AI')">

        🎵
        <br>

        Song AI

      </button>


      <button
        class="study"
        onclick="quickAsk('Study AI')">

        📖
        <br>

        Study AI

      </button>


      <button
        class="comedy"
        onclick="quickAsk('Comedy AI')">

        😀
        <br>

        Comedy AI

      </button>

    </div>

  </main>

</div>


<script>

  function reply() {

    const input =
      document.getElementById("question");

    const answer =
      document.getElementById("answer");

    const question =
      input.value.trim();


    answer.style.display = "block";


    if (question === "") {

      answer.textContent =
        "पहले कोई सवाल लिखिए।";

      return;
    }


    answer.textContent =
      "आपने पूछा:\n\n" +
      question +
      "\n\n" +
      "🙏 PriyaVRana-Ai 🙏\n" +
      "अभी AI backend connect नहीं है। " +
      "अगले चरण में secure AI API जोड़ी जाएगी।";

  }


  function quickAsk(name) {

    const input =
      document.getElementById("question");

    input.value =
      name +
      " में मेरी मदद करो";

    input.focus();

  }


  function selectMenu(name) {

    const buttons =
      document.querySelectorAll(
        ".menu button"
      );


    buttons.forEach(function(button) {

      button.classList.remove("active");

    });


    event.currentTarget
      .classList.add("active");


    const input =
      document.getElementById("question");


    if (name === "Home") {

      input.value = "";

    } else {

      input.value =
        name +
        " में मेरी मदद करो";

    }


    input.focus();

  }

</script>

</body>
</html>
